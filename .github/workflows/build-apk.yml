name: Build Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 🟢 Setup Node.js (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚙️ Expo Prebuild (Continuous Native Generation)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" Personal-Library-v1.0.0.apk
          echo "apk_path=Personal-Library-v1.0.0.apk" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Library-v1.0.0-apk
          path: Personal-Library-v1.0.0.apk
          if-no-files-found: error

      - name: 🚀 Release on GitHub (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Personal-Library-v1.0.0.apk
          generate_release_notes: true
          draft: false
          prerelease: false
